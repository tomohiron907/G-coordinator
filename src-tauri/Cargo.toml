[package]
name = "g-coordinator"
version = "0.1.0"
edition = "2021"

[lib]
name = "g_coordinator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic  = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
